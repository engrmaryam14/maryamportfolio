<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgPort" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141d" />
      <stop offset="50%" stop-color="#191924" />
      <stop offset="100%" stop-color="#0e0e14" />
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a476ff" />
      <stop offset="100%" stop-color="#ff79c6" />
    </linearGradient>
    <filter id="blurPort" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgPort)" />
  <circle cx="200" cy="200" r="140" fill="#a476ff" opacity="0.16" filter="url(#blurPort)" />
  <circle cx="600" cy="300" r="150" fill="#ff79c6" opacity="0.10" filter="url(#blurPort)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Portfolio Window Mockup -->
  <g transform="translate(140, 75)">
    <rect width="520" height="350" rx="16" fill="#12121a" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

    <!-- Top Bar -->
    <rect width="520" height="42" rx="16" fill="#181824" />
    <circle cx="25" cy="21" r="5" fill="#ff5f56" />
    <circle cx="43" cy="21" r="5" fill="#ffbd2e" />
    <circle cx="61" cy="21" r="5" fill="#27c93f" />
    <text x="260" y="26" text-anchor="middle" fill="#9f9cb8" font-family="sans-serif" font-size="12" font-weight="500">Maryam Naz • Personal Portfolio</text>

    <!-- Nav Bar Inside Window -->
    <rect x="160" y="55" width="200" height="24" rx="12" fill="#1f1f2e" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="185" y="71" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="600">Home</text>
    <text x="235" y="71" fill="#9f9cb8" font-family="sans-serif" font-size="9">Projects</text>
    <text x="295" y="71" fill="#9f9cb8" font-family="sans-serif" font-size="9">Contact</text>

    <!-- Hero Mock -->
    <text x="40" y="125" fill="#9f9cb8" font-family="sans-serif" font-size="12">Hi, I'm Maryam Naz</text>
    <text x="40" y="160" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">Software Engineer</text>
    <text x="40" y="190" fill="#a476ff" font-family="sans-serif" font-size="24" font-weight="bold">&amp; Web Developer</text>
    <text x="40" y="220" fill="#787594" font-family="sans-serif" font-size="11">Building responsive web apps, cloud backends &amp; AI-assisted workflows.</text>

    <!-- Buttons -->
    <rect x="40" y="245" width="115" height="32" rx="8" fill="#a476ff" />
    <text x="97" y="265" text-anchor="middle" fill="#0d0d12" font-family="sans-serif" font-size="11" font-weight="bold">View Projects</text>
    <rect x="165" y="245" width="115" height="32" rx="8" fill="#1e1e2c" stroke="#ffffff" stroke-opacity="0.12" />
    <text x="222" y="265" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="11">Get in Touch</text>

    <!-- Mini Visual Card on Right -->
    <rect x="340" y="110" width="145" height="180" rx="12" fill="#1b1a29" stroke="#a476ff" stroke-opacity="0.25" stroke-width="1.5" />
    <rect x="355" y="130" width="115" height="20" rx="6" fill="#a476ff" opacity="0.2" />
    <text x="412" y="144" text-anchor="middle" fill="#a476ff" font-family="sans-serif" font-size="10" font-weight="bold">REACT + TAILWIND</text>
    <circle cx="412" cy="200" r="30" fill="#a476ff" opacity="0.15" />
    <text x="412" y="206" text-anchor="middle" font-size="20">✨</text>
    <rect x="360" y="250" width="105" height="12" rx="4" fill="#ffffff" opacity="0.2" />
    <rect x="375" y="270" width="75" height="10" rx="4" fill="#a476ff" opacity="0.4" />
  </g>
</svg>
