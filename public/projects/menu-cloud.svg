<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgMenu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a24" />
      <stop offset="50%" stop-color="#11222e" />
      <stop offset="100%" stop-color="#0c131a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3a7bd5" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5af19" />
      <stop offset="100%" stop-color="#e65c00" />
    </linearGradient>
    <filter id="blurMenu" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgMenu)" />
  <circle cx="240" cy="160" r="140" fill="#00d2ff" opacity="0.14" filter="url(#blurMenu)" />
  <circle cx="620" cy="360" r="160" fill="#f5af19" opacity="0.10" filter="url(#blurMenu)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Container Mockup -->
  <g transform="translate(140, 75)">
    <!-- Main Window -->
    <rect width="520" height="350" rx="16" fill="#101820" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

    <!-- Top Bar -->
    <rect width="520" height="42" rx="16" fill="#14212e" />
    <circle cx="25" cy="21" r="5" fill="#ff5f56" />
    <circle cx="43" cy="21" r="5" fill="#ffbd2e" />
    <circle cx="61" cy="21" r="5" fill="#27c93f" />
    <text x="260" y="26" text-anchor="middle" fill="#8cb2cc" font-family="sans-serif" font-size="12" font-weight="500">Menu Cloud System • Digital Restaurant Menu &amp; Catalog</text>

    <!-- Search & Categories Bar -->
    <rect x="25" y="60" width="300" height="32" rx="8" fill="#172836" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="40" y="81" fill="#789ab2" font-family="sans-serif" font-size="11">🔍 Search dishes, beverages, desserts...</text>
    <rect x="340" y="60" width="75" height="32" rx="8" fill="#00d2ff" opacity="0.9" />
    <text x="377" y="81" text-anchor="middle" fill="#091823" font-family="sans-serif" font-size="11" font-weight="bold">Hot Items</text>
    <rect x="425" y="60" width="70" height="32" rx="8" fill="#172836" />
    <text x="460" y="81" text-anchor="middle" fill="#8cb2cc" font-family="sans-serif" font-size="11">Beverages</text>

    <!-- Menu Item Card 1 -->
    <g transform="translate(25, 110)">
      <rect width="225" height="100" rx="10" fill="#152431" stroke="#ffffff" stroke-opacity="0.08" />
      <rect x="12" y="15" width="70" height="70" rx="8" fill="#f5af19" opacity="0.2" />
      <text x="47" y="55" text-anchor="middle" font-size="28">☕</text>
      <text x="95" y="35" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Artisan Cappuccino</text>
      <text x="95" y="52" fill="#789ab2" font-family="sans-serif" font-size="10">Double shot with steamed milk</text>
      <text x="95" y="78" fill="#00d2ff" font-family="sans-serif" font-size="14" font-weight="bold">$4.50</text>
      <rect x="165" y="65" width="48" height="20" rx="5" fill="#00d2ff" opacity="0.2" />
      <text x="189" y="79" text-anchor="middle" fill="#00d2ff" font-family="sans-serif" font-size="9" font-weight="bold">ONLINE</text>
    </g>

    <!-- Menu Item Card 2 -->
    <g transform="translate(270, 110)">
      <rect width="225" height="100" rx="10" fill="#152431" stroke="#ffffff" stroke-opacity="0.08" />
      <rect x="12" y="15" width="70" height="70" rx="8" fill="#e65c00" opacity="0.2" />
      <text x="47" y="55" text-anchor="middle" font-size="28">🍔</text>
      <text x="95" y="35" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Signature Burger</text>
      <text x="95" y="52" fill="#789ab2" font-family="sans-serif" font-size="10">Brioche bun, smoked cheddar</text>
      <text x="95" y="78" fill="#00d2ff" font-family="sans-serif" font-size="14" font-weight="bold">$12.00</text>
      <rect x="165" y="65" width="48" height="20" rx="5" fill="#00d2ff" opacity="0.2" />
      <text x="189" y="79" text-anchor="middle" fill="#00d2ff" font-family="sans-serif" font-size="9" font-weight="bold">ONLINE</text>
    </g>

    <!-- Menu Item Card 3 -->
    <g transform="translate(25, 225)">
      <rect width="225" height="100" rx="10" fill="#152431" stroke="#ffffff" stroke-opacity="0.08" />
      <rect x="12" y="15" width="70" height="70" rx="8" fill="#20c997" opacity="0.2" />
      <text x="47" y="55" text-anchor="middle" font-size="28">🥗</text>
      <text x="95" y="35" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Mediterranean Bowl</text>
      <text x="95" y="52" fill="#789ab2" font-family="sans-serif" font-size="10">Avocado, quinoa, feta cheese</text>
      <text x="95" y="78" fill="#00d2ff" font-family="sans-serif" font-size="14" font-weight="bold">$9.50</text>
      <rect x="165" y="65" width="48" height="20" rx="5" fill="#00d2ff" opacity="0.2" />
      <text x="189" y="79" text-anchor="middle" fill="#00d2ff" font-family="sans-serif" font-size="9" font-weight="bold">ONLINE</text>
    </g>

    <!-- Menu Item Card 4 -->
    <g transform="translate(270, 225)">
      <rect width="225" height="100" rx="10" fill="#152431" stroke="#ffffff" stroke-opacity="0.08" />
      <rect x="12" y="15" width="70" height="70" rx="8" fill="#ff7262" opacity="0.2" />
      <text x="47" y="55" text-anchor="middle" font-size="28">🍰</text>
      <text x="95" y="35" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Berry Cheesecake</text>
      <text x="95" y="52" fill="#789ab2" font-family="sans-serif" font-size="10">Fresh raspberry glaze</text>
      <text x="95" y="78" fill="#00d2ff" font-family="sans-serif" font-size="14" font-weight="bold">$6.00</text>
      <rect x="165" y="65" width="48" height="20" rx="5" fill="#00d2ff" opacity="0.2" />
      <text x="189" y="79" text-anchor="middle" fill="#00d2ff" font-family="sans-serif" font-size="9" font-weight="bold">ONLINE</text>
    </g>
  </g>
</svg>
