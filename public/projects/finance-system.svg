<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141124" />
      <stop offset="50%" stop-color="#1a1436" />
      <stop offset="100%" stop-color="#0e0c18" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a476ff" />
      <stop offset="100%" stop-color="#6e42c1" />
    </linearGradient>
    <linearGradient id="tealGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20c997" />
      <stop offset="100%" stop-color="#0dcaf0" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="180" r="140" fill="#a476ff" opacity="0.15" filter="url(#blur)" />
  <circle cx="650" cy="350" r="160" fill="#20c997" opacity="0.12" filter="url(#blur)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Dashboard Card Mockup -->
  <g transform="translate(140, 75)">
    <!-- Main Window -->
    <rect width="520" height="350" rx="16" fill="#12111d" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

    <!-- Top Bar -->
    <rect width="520" height="42" rx="16" fill="#191729" />
    <circle cx="25" cy="21" r="5" fill="#ff5f56" />
    <circle cx="43" cy="21" r="5" fill="#ffbd2e" />
    <circle cx="61" cy="21" r="5" fill="#27c93f" />
    <text x="260" y="26" text-anchor="middle" fill="#9d98b8" font-family="sans-serif" font-size="12" font-weight="500">Organization Finance Platform • Realtime Dashboard</text>

    <!-- Sidebar Mini -->
    <rect x="0" y="42" width="110" height="308" fill="#151322" />
    <rect x="15" y="65" width="80" height="12" rx="4" fill="#a476ff" opacity="0.8" />
    <rect x="15" y="95" width="70" height="10" rx="4" fill="#ffffff" opacity="0.15" />
    <rect x="15" y="120" width="75" height="10" rx="4" fill="#ffffff" opacity="0.15" />
    <rect x="15" y="145" width="65" height="10" rx="4" fill="#ffffff" opacity="0.15" />
    <rect x="15" y="170" width="80" height="10" rx="4" fill="#ffffff" opacity="0.15" />

    <!-- Stat Card 1 -->
    <rect x="130" y="60" width="175" height="75" rx="10" fill="#1d1a33" stroke="#a476ff" stroke-opacity="0.3" stroke-width="1" />
    <text x="145" y="82" fill="#9d98b8" font-family="sans-serif" font-size="11">Total Revenue</text>
    <text x="145" y="112" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">$124,580</text>
    <text x="240" y="112" fill="#20c997" font-family="sans-serif" font-size="11" font-weight="600">+14.2%</text>

    <!-- Stat Card 2 -->
    <rect x="325" y="60" width="175" height="75" rx="10" fill="#1d1a33" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <text x="340" y="82" fill="#9d98b8" font-family="sans-serif" font-size="11">Total Expenses</text>
    <text x="340" y="112" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">$42,890</text>
    <text x="440" y="112" fill="#a476ff" font-family="sans-serif" font-size="11" font-weight="600">-6.4%</text>

    <!-- Chart Card -->
    <rect x="130" y="150" width="370" height="180" rx="12" fill="#18152b" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="145" y="175" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Real-Time Income vs Expense Analytics</text>
    
    <!-- Bar charts -->
    <rect x="155" y="270" width="22" height="40" rx="4" fill="#a476ff" />
    <rect x="182" y="250" width="22" height="60" rx="4" fill="#20c997" />
    <rect x="220" y="235" width="22" height="75" rx="4" fill="#a476ff" />
    <rect x="247" y="210" width="22" height="100" rx="4" fill="#20c997" />
    <rect x="285" y="220" width="22" height="90" rx="4" fill="#a476ff" />
    <rect x="312" y="195" width="22" height="115" rx="4" fill="#20c997" />
    <rect x="350" y="205" width="22" height="105" rx="4" fill="#a476ff" />
    <rect x="377" y="190" width="22" height="120" rx="4" fill="#20c997" />
    <rect x="415" y="230" width="22" height="80" rx="4" fill="#a476ff" />
    <rect x="442" y="200" width="22" height="110" rx="4" fill="#20c997" />

    <!-- Badges -->
    <g transform="translate(130, 310)">
      <circle cx="15" cy="5" r="4" fill="#a476ff" />
      <text x="25" y="9" fill="#9d98b8" font-family="sans-serif" font-size="10">Income (Firestore Sync)</text>
      <circle cx="160" cy="5" r="4" fill="#20c997" />
      <text x="170" y="9" fill="#9d98b8" font-family="sans-serif" font-size="10">Expense (Live Stream)</text>
    </g>
  </g>
</svg>
